name: wqpu-devnet-rpc-smoke

on:
  push:
    branches: [next-foundation]
    paths:
      - 'chain/runtime.lock'
      - 'chain/devnet.sh'
      - 'chain/devnet_config.py'
      - 'chain/runtime_patch.py'
      - 'chain/runtime_patch_settlement.py'
      - 'chain/cmd/wqpu-selector/**'
      - 'chain/x/wqpu/precompile/**'
      - '.github/workflows/wqpu-devnet-rpc-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-rpc:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'
      - name: Boot sovereign WQPU devnet and call native precompile
        shell: bash
        env:
          WQPU_CHAIN_SRC: ${{ runner.temp }}/cosmos-evm
          WQPU_CHAIN_BIN_DIR: ${{ runner.temp }}/wqpu-bin
          WQPU_CHAIN_HOME: ${{ runner.temp }}/wqpu-home
        run: |
          set -euo pipefail

          PRECOMPILE='0x0000000000000000000000000000000000000900'
          selector() {
            (cd chain && go run ./cmd/wqpu-selector "$1")
          }
          PROTOCOL_SELECTOR="$(selector 'protocolVersion()')"
          PRICE_SELECTOR="$(selector 'globalPrice()')"
          EPOCH_SELECTOR="$(selector 'priceEpoch()')"
          BONDED_SELECTOR="$(selector 'bondedPriceCapacity()')"

          LOG="${RUNNER_TEMP}/wqpu-devnet.log"
          bash chain/devnet.sh --reset >"$LOG" 2>&1 &
          PID=$!
          cleanup() {
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 180); do
            if ! kill -0 "$PID" 2>/dev/null; then
              cat "$LOG"
              echo 'WQPU devnet exited before JSON-RPC became ready' >&2
              exit 1
            fi
            if curl -fsS \
              -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' \
              http://127.0.0.1:8545 >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat "$LOG"
            echo 'WQPU JSON-RPC did not become ready' >&2
            exit 1
          fi

          rpc_call() {
            local data="$1"
            curl -fsS \
              -H 'content-type: application/json' \
              --data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_call\",\"params\":[{\"to\":\"$PRECOMPILE\",\"data\":\"0x$data\"},\"latest\"]}" \
              http://127.0.0.1:8545
          }

          assert_uint() {
            local response="$1"
            local expected="$2"
            python3 - "$response" "$expected" <<'PY'
          import json
          import sys
          response = json.loads(sys.argv[1])
          if "error" in response:
              raise SystemExit("JSON-RPC error: {}".format(response["error"]))
          value = int(response.get("result", "0x0"), 16)
          expected = int(sys.argv[2])
          if value != expected:
              raise SystemExit("expected {}, got {} ({})".format(expected, value, response))
          PY
          }

          assert_uint "$(rpc_call "$PROTOCOL_SELECTOR")" 1
          assert_uint "$(rpc_call "$PRICE_SELECTOR")" 1000
          assert_uint "$(rpc_call "$EPOCH_SELECTOR")" 0
          assert_uint "$(rpc_call "$BONDED_SELECTOR")" 0

          grep -F 'precompile:    0x0000000000000000000000000000000000000900' "$LOG"
          echo 'Live WQPU 0x0900 JSON-RPC smoke passed.'
