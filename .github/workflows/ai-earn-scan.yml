name: AI Earn Scan

on:
  push:
    branches: [ai-earn-runner]
    paths:
      - .github/workflows/ai-earn-scan.yml

permissions:
  contents: write

jobs:
  scan-agentlot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-earn-runner

      - name: Query AgentLot MCP anonymously
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ai-earn
          URL="https://agentlot.io/mcp"
          ACCEPT="application/json, text/event-stream"

          curl -fsS -D .ai-earn/init.headers -o .ai-earn/init.raw \
            -X POST "$URL" \
            -H 'Content-Type: application/json' \
            -H "Accept: $ACCEPT" \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"github-ai-earn-runner","version":"1.0"}}}'

          SESSION="$(awk 'BEGIN{IGNORECASE=1} /^mcp-session-id:/ {gsub("\r",""); sub(/^[^:]+:[[:space:]]*/,""); print; exit}' .ai-earn/init.headers || true)"
          printf '%s' "$SESSION" > .ai-earn/session-id.txt

          EXTRA=()
          if [ -n "$SESSION" ]; then EXTRA=(-H "Mcp-Session-Id: $SESSION"); fi

          # Initialization notification is best-effort; some stateless servers do not need it.
          curl -sS -o .ai-earn/initialized.raw \
            -X POST "$URL" \
            -H 'Content-Type: application/json' \
            -H "Accept: $ACCEPT" \
            "${EXTRA[@]}" \
            --data '{"jsonrpc":"2.0","method":"notifications/initialized","params":{}}' || true

          curl -fsS -o .ai-earn/tools.raw \
            -X POST "$URL" \
            -H 'Content-Type: application/json' \
            -H "Accept: $ACCEPT" \
            "${EXTRA[@]}" \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'

          curl -sS -o .ai-earn/earn-now.raw \
            -X POST "$URL" \
            -H 'Content-Type: application/json' \
            -H "Accept: $ACCEPT" \
            "${EXTRA[@]}" \
            --data '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"earn_now","arguments":{}}}' || true

          curl -sS -o .ai-earn/list-requests.raw \
            -X POST "$URL" \
            -H 'Content-Type: application/json' \
            -H "Accept: $ACCEPT" \
            "${EXTRA[@]}" \
            --data '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"list_requests","arguments":{}}}' || true

          python3 - <<'PY'
          from pathlib import Path
          import json

          def parse_sse(path):
              p = Path(path)
              text = p.read_text(errors='replace') if p.exists() else ''
              values = []
              for line in text.splitlines():
                  line = line.strip()
                  if line.startswith('data:'):
                      line = line[5:].strip()
                  if not line or line.startswith(('event:', ':')):
                      continue
                  try:
                      values.append(json.loads(line))
                  except Exception:
                      pass
              if values:
                  return values[-1] if len(values) == 1 else values
              try:
                  return json.loads(text)
              except Exception:
                  return {'raw': text}

          for src, dst in [
              ('.ai-earn/init.raw', '.ai-earn/init.json'),
              ('.ai-earn/tools.raw', '.ai-earn/tools.json'),
              ('.ai-earn/earn-now.raw', '.ai-earn/earn-now.json'),
              ('.ai-earn/list-requests.raw', '.ai-earn/list-requests.json'),
          ]:
              Path(dst).write_text(json.dumps(parse_sse(src), indent=2, ensure_ascii=False) + '\n')
          PY

          # Do not persist session identifiers or transport headers.
          rm -f .ai-earn/*.raw .ai-earn/*.headers .ai-earn/session-id.txt .ai-earn/initialized.raw

      - name: Commit public scan results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ai-earn-runner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ai-earn/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: record AgentLot earning opportunities"
          git push origin HEAD:ai-earn-runner
