name: wqpu-runtime-overlay-smoke

on:
  push:
    branches: [next-foundation]
    paths:
      - 'chain/runtime.lock'
      - 'chain/devnet.sh'
      - 'chain/devnet_config.py'
      - 'chain/runtime_patch.py'
      - 'chain/x/wqpu/precompile/**'
      - '.github/workflows/wqpu-runtime-overlay-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patched-wqpud:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'
      - name: Prepare exact pinned Cosmos EVM runtime
        env:
          WQPU_CHAIN_SRC: ${{ runner.temp }}/cosmos-evm
          WQPU_CHAIN_BIN_DIR: ${{ runner.temp }}/wqpu-bin
        run: bash chain/devnet.sh --build-only
      - name: Apply minimal WQPU native-precompile overlay
        env:
          WQPU_CHAIN_SRC: ${{ runner.temp }}/cosmos-evm
        run: >-
          python chain/runtime_patch.py
          --source "$WQPU_CHAIN_SRC"
          --overlay chain/x/wqpu/precompile
      - name: Rebuild patched daemon
        working-directory: ${{ runner.temp }}/cosmos-evm
        env:
          WQPU_CHAIN_BIN_DIR: ${{ runner.temp }}/wqpu-bin
        shell: bash
        run: |
          set -euo pipefail
          pkg="$(go list -f '{{if eq .Name "main"}}{{.ImportPath}}{{end}}' ./... | grep 'evmd' | head -n 1)"
          test -n "$pkg"
          echo "Building WQPU runtime from $pkg"
          mkdir -p "$WQPU_CHAIN_BIN_DIR"
          go build -trimpath -o "$WQPU_CHAIN_BIN_DIR/wqpud" "$pkg"
      - name: Verify patched daemon starts
        run: ${{ runner.temp }}/wqpu-bin/wqpud version
      - name: Verify overlay exists in exact build tree
        run: |
          test -f "${{ runner.temp }}/cosmos-evm/precompiles/wqpu/contract.go"
          grep -F 'wqpuprecompile.WithWQPU(precompiletypes.DefaultStaticPrecompiles(' "${{ runner.temp }}/cosmos-evm/evmd/app.go"
