name: llama-runtime-smoke

on:
  push:
    branches: [next-foundation]
    paths:
      - 'client/internal/llamaruntime/**'
      - 'client/internal/carrier/**'
      - 'client/internal/chainregistry/**'
      - 'client/internal/peertransport/**'
      - 'client/internal/rpctunnel/**'
      - 'client/internal/sessionkey/**'
      - 'client/internal/transport/**'
      - 'client/cmd/wqpu-runtime-install/**'
      - 'client/cmd/wqpu-llama-rpc-smoke/**'
      - 'client/cmd/wqpu-llama-model-smoke/**'
      - '.github/workflows/llama-runtime-smoke.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  official-linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'
          cache-dependency-path: client/go.mod

      - name: Resolve pinned WQPU client module checksums
        working-directory: client
        run: go mod tidy

      - name: Install exact official llama.cpp through production WQPU installer
        shell: bash
        run: |
          set -euo pipefail
          BASE="${RUNNER_TEMP}/wqpu-runtime"
          echo "WQPU_RUNTIME_BASE=$BASE" >> "$GITHUB_ENV"
          (cd client && go run ./cmd/wqpu-runtime-install "$BASE") > runtime.paths
          cat runtime.paths

          TAG="$(sed -n 's/^tag=//p' runtime.paths)"
          ROOT="$(sed -n 's/^root=//p' runtime.paths)"
          RPC="$(sed -n 's/^rpc=//p' runtime.paths)"
          SERVER="$(sed -n 's/^server=//p' runtime.paths)"
          CLI="$(sed -n 's/^cli=//p' runtime.paths)"

          test "$TAG" = 'b10453'
          test -n "$ROOT" && test -d "$ROOT"
          test -n "$RPC" && test -x "$RPC"
          test -n "$SERVER" && test -x "$SERVER"
          test -n "$CLI" && test -x "$CLI"
          case "$ROOT" in "$BASE"/*) ;; *) echo 'runtime escaped WQPU base directory' >&2; exit 1;; esac

          # A second invocation must safely reuse the complete installed runtime.
          (cd client && go run ./cmd/wqpu-runtime-install "$BASE") > runtime.second.paths
          cmp runtime.paths runtime.second.paths

      - name: Verify installed RPC/server/CLI flags
        shell: bash
        run: |
          set -euo pipefail
          RPC="$(sed -n 's/^rpc=//p' runtime.paths)"
          SERVER="$(sed -n 's/^server=//p' runtime.paths)"
          CLI="$(sed -n 's/^cli=//p' runtime.paths)"

          "$RPC" --help > rpc.help 2>&1
          grep -F -- '--host HOST' rpc.help
          grep -F -- '--port PORT' rpc.help
          grep -F -- '--device <dev1,dev2,...>' rpc.help
          grep -F -- '--cache' rpc.help

          "$SERVER" --help > server.help 2>&1
          grep -F -- '--rpc' server.help
          grep -F -- '--fit' server.help
          grep -F -- '--host' server.help
          grep -F -- '--port' server.help
          grep -F -- '--hf-file' server.help
          grep -F -- '--device' server.help
          grep -F -- '--n-gpu-layers' server.help

          "$CLI" --help > cli.help 2>&1
          grep -F -- '--rpc' cli.help
          grep -F -- '--list-devices' cli.help

      - name: Send real llama.cpp RPC protocol through managed WQPU SecureStream
        shell: bash
        run: |
          set -euo pipefail
          (cd client && go run ./cmd/wqpu-llama-rpc-smoke --runtime-base "$WQPU_RUNTIME_BASE") 2>&1 | tee managed-rpc.log
          grep -F 'real llama.cpp RPC crossed WQPU SecureStream' managed-rpc.log
          if grep -Fq "WARNING: Host ('127.0.0.1') is != '127.0.0.1'" managed-rpc.log; then
            echo 'managed llama.cpp RPC backend unexpectedly left loopback' >&2
            exit 1
          fi

      - name: Load and infer a tiny model on remote WQPU RPC0
        shell: bash
        run: |
          set -euo pipefail
          # b10453's own server tests use ggml-org/models +
          # tinyllamas/stories260K.gguf. The helper starts llama-server with
          # --device RPC0 --n-gpu-layers 99, waits for /health=200, then POSTs
          # /completion. If the encrypted remote backend is absent, startup fails.
          (cd client && go run ./cmd/wqpu-llama-model-smoke --runtime-base "$WQPU_RUNTIME_BASE") 2>&1 | tee model-smoke.log
          grep -F 'tiny model inference crossed remote WQPU RPC0' model-smoke.log
          grep -F 'RPC0' "$WQPU_RUNTIME_BASE/model-smoke-server.log"
          echo 'Remote WQPU RPC0 model-load and inference smoke passed.'
