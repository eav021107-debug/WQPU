name: AI Earn Trigger

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ai-earn-trigger.yml
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  scan-agentlot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-earn-runner

      - name: Query AgentLot MCP anonymously
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ai-earn
          URL="https://agentlot.io/mcp"
          ACCEPT="application/json, text/event-stream"

          post() {
            local outfile="$1" payload="$2"
            shift 2
            curl -sS --no-buffer --max-time 8 -o "$outfile" -X POST "$URL" \
              -H 'Content-Type: application/json' -H "Accept: $ACCEPT" "$@" \
              --data "$payload" || true
          }

          curl -sS --no-buffer --max-time 8 -D .ai-earn/init.headers -o .ai-earn/init.raw \
            -X POST "$URL" -H 'Content-Type: application/json' -H "Accept: $ACCEPT" \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"github-ai-earn-runner","version":"1.1"}}}' || true

          SESSION="$(awk 'BEGIN{IGNORECASE=1} /^mcp-session-id:/ {gsub("\r",""); sub(/^[^:]+:[[:space:]]*/,""); print; exit}' .ai-earn/init.headers || true)"
          EXTRA=()
          if [ -n "$SESSION" ]; then EXTRA=(-H "Mcp-Session-Id: $SESSION"); fi

          post /dev/null '{"jsonrpc":"2.0","method":"notifications/initialized","params":{}}' "${EXTRA[@]}"
          post .ai-earn/tools.raw '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' "${EXTRA[@]}"
          post .ai-earn/earn-now.raw '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"earn_now","arguments":{}}}' "${EXTRA[@]}"
          post .ai-earn/list-requests.raw '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"list_requests","arguments":{}}}' "${EXTRA[@]}"
          post .ai-earn/global-earn.raw '{"jsonrpc":"2.0","id":5,"method":"tools/call","params":{"name":"search_global_earn","arguments":{}}}' "${EXTRA[@]}"
          post .ai-earn/external-earn.raw '{"jsonrpc":"2.0","id":6,"method":"tools/call","params":{"name":"search_external_earn","arguments":{}}}' "${EXTRA[@]}"

          python3 - <<'PY'
          from pathlib import Path
          import json
          def parse(path):
              p=Path(path)
              text=p.read_text(errors='replace') if p.exists() else ''
              vals=[]
              for line in text.splitlines():
                  s=line.strip()
                  if s.startswith('data:'): s=s[5:].strip()
                  if not s or s.startswith(('event:', ':')): continue
                  try: vals.append(json.loads(s))
                  except Exception: pass
              if vals: return vals[-1] if len(vals)==1 else vals
              try: return json.loads(text)
              except Exception: return {'raw':text}
          for stem in ['init','tools','earn-now','list-requests','global-earn','external-earn']:
              Path(f'.ai-earn/{stem}.json').write_text(json.dumps(parse(f'.ai-earn/{stem}.raw'),indent=2,ensure_ascii=False)+'\n')
          PY
          rm -f .ai-earn/*.raw .ai-earn/*.headers

      - name: Commit public scan results to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ai-earn-runner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ai-earn/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: record live AgentLot earning opportunities"
          git push origin HEAD:ai-earn-runner
