name: WQPU testnet stack

on:
  push:
    paths:
      - 'scripts/testnet_stack.py'
      - 'wqpu_rpc_gateway.py'
      - 'wqpu_relayer.py'
      - 'wqpu_transport_relay.py'
      - 'wqpu_wallet.py'
      - 'contracts/**'
      - 'tests/test_rpc_gateway.py'
      - 'tests/test_testnet_stack.py'
      - 'tests/test_wallet_faucet.py'
      - '.github/workflows/testnet-stack.yml'
  pull_request:
    paths:
      - 'scripts/testnet_stack.py'
      - 'wqpu_rpc_gateway.py'
      - 'wqpu_relayer.py'
      - 'wqpu_transport_relay.py'
      - 'wqpu_wallet.py'
      - 'contracts/**'
      - 'tests/test_rpc_gateway.py'
      - 'tests/test_testnet_stack.py'
      - 'tests/test_wallet_faucet.py'
      - '.github/workflows/testnet-stack.yml'

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile stack modules
        run: python -m py_compile wqpu_rpc_gateway.py wqpu_relayer.py wqpu_wallet.py scripts/testnet_stack.py
      - name: Test stack policy/config
        run: python -m unittest tests.test_rpc_gateway tests.test_testnet_stack tests.test_wallet_faucet -v

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Start complete testnet stack
        shell: bash
        run: |
          unset RUNNER_TRACKING_ID
          python scripts/testnet_stack.py start \
            --public-host 127.0.0.1 \
            --internal-rpc-port 28546 \
            --rpc-port 18545 \
            --relayer-port 18787 \
            --relay-port 17443
      - name: Check stack status
        run: python scripts/testnet_stack.py status
      - name: Check published config and join scripts
        shell: bash
        run: |
          curl -fsS http://127.0.0.1:18545/health
          curl -fsS http://127.0.0.1:18787/health
          curl -fsS http://127.0.0.1:18787/network-config.json | python -c 'import json,sys; d=json.load(sys.stdin); assert d["public"]["enabled"] is True; assert d["public"]["testnet"] is True'
          curl -fsS http://127.0.0.1:18787/join.sh | grep -F 'WQPU_NO_START=1'
          curl -fsS http://127.0.0.1:18787/join.ps1 | grep -F "WQPU_NO_START = '1'"
      - name: Verify public RPC is restricted
        shell: bash
        run: |
          CHAIN=$(curl -fsS -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' http://127.0.0.1:18545)
          echo "$CHAIN" | grep -F '0x7a69'
          BLOCKED=$(curl -fsS -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":2,"method":"eth_accounts","params":[]}' http://127.0.0.1:18545)
          echo "$BLOCKED" | grep -F 'blocked by WQPU testnet gateway'
      - name: Faucet funds a fresh wallet
        shell: bash
        run: |
          WALLET=0x1111111111111111111111111111111111111111
          RESPONSE=$(curl -fsS -H 'content-type: application/json' --data "{\"wallet\":\"$WALLET\"}" http://127.0.0.1:18787/faucet)
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -F 'transactions'
          BALANCE=$(cast balance "$WALLET" --rpc-url http://127.0.0.1:18545)
          echo "funded balance=$BALANCE"
          test "$BALANCE" != "0"
          REGISTRY=$(curl -fsS http://127.0.0.1:18787/network-config.json | python -c 'import json,sys; print(json.load(sys.stdin)["public"]["registry"])')
          printf '%s\n' "$REGISTRY" > /tmp/wqpu-registry-before
          printf '%s\n' "$BALANCE" > /tmp/wqpu-balance-before
      - name: Stop and resume the same chain
        shell: bash
        run: |
          python scripts/testnet_stack.py stop
          test -s .wqpu-testnet/anvil-state.json
          test -s .wqpu-testnet/deployment.json
          test -s .wqpu-testnet/operator.json
          unset RUNNER_TRACKING_ID
          python scripts/testnet_stack.py start \
            --public-host 127.0.0.1 \
            --internal-rpc-port 28546 \
            --rpc-port 18545 \
            --relayer-port 18787 \
            --relay-port 17443
          python scripts/testnet_stack.py status
          BEFORE_REGISTRY=$(cat /tmp/wqpu-registry-before)
          AFTER_REGISTRY=$(curl -fsS http://127.0.0.1:18787/network-config.json | python -c 'import json,sys; print(json.load(sys.stdin)["public"]["registry"])')
          echo "registry before=$BEFORE_REGISTRY after=$AFTER_REGISTRY"
          test "$BEFORE_REGISTRY" = "$AFTER_REGISTRY"
          BEFORE_BALANCE=$(cat /tmp/wqpu-balance-before)
          AFTER_BALANCE=$(cast balance 0x1111111111111111111111111111111111111111 --rpc-url http://127.0.0.1:18545)
          echo "balance before=$BEFORE_BALANCE after=$AFTER_BALANCE"
          test "$BEFORE_BALANCE" = "$AFTER_BALANCE"
          python -c 'import json; s=json.load(open(".wqpu-testnet/state.json")); assert s["resumed"] is True; assert s["persistent"] is True'
      - name: Start HTTPS operator stack
        shell: bash
        run: |
          python scripts/testnet_stack.py stop
          python scripts/testnet_stack.py reset --yes
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 \
            -subj '/CN=127.0.0.1' \
            -addext 'subjectAltName = IP:127.0.0.1' \
            -keyout /tmp/wqpu-testnet-key.pem -out /tmp/wqpu-testnet-cert.pem >/dev/null 2>&1
          unset RUNNER_TRACKING_ID
          python scripts/testnet_stack.py start \
            --public-host 127.0.0.1 \
            --internal-rpc-port 28546 \
            --rpc-port 18545 \
            --relayer-port 18787 \
            --relay-port 17443 \
            --tls-cert /tmp/wqpu-testnet-cert.pem \
            --tls-key /tmp/wqpu-testnet-key.pem
          curl -kfsS https://127.0.0.1:18545/health
          curl -kfsS https://127.0.0.1:18787/health
          curl -kfsS https://127.0.0.1:18787/network-config.json | python -c 'import json,sys; p=json.load(sys.stdin)["public"]; assert p["rpc_url"].startswith("https://"); assert p["relayer_url"].startswith("https://"); assert p["faucet_url"].startswith("https://")'
          python -c 'import json; s=json.load(open(".wqpu-testnet/state.json")); assert s["tls_enabled"] is True; assert s["public_scheme"] == "https"'
      - name: Stop testnet stack
        if: always()
        run: |
          python scripts/testnet_stack.py stop || true
          echo '--- rpc gateway log ---'; cat .wqpu-testnet/logs/rpc-gateway.log 2>/dev/null || true
          echo '--- relayer log ---'; cat .wqpu-testnet/logs/relayer.log 2>/dev/null || true
          echo '--- transport log ---'; cat .wqpu-testnet/logs/transport-relay.log 2>/dev/null || true
