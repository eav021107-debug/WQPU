name: WQPU tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python
        run: python -m py_compile wqpu.py wqpu_chain.py wqpu_wallet.py wqpu_runtime.py scripts/devnet.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Runtime version
        run: python wqpu_runtime.py --version

  solidity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile contracts with solc
        run: >-
          npx --yes solc@0.8.35 --bin
          contracts/WQPUToken.sol
          contracts/WQPURegistry.sol
          contracts/WQPUComputeMarket.sol
          -o /tmp/wqpu-solc
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Foundry build
        run: forge build
      - name: Deploy local WQPU devnet
        run: python scripts/devnet.py
