name: one-time-fix-job-rounding

on:
  push:
    branches: [next-foundation]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: next-foundation
      - name: Fix per-provider rounding bound and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          job = Path('chain/x/wqpu/precompile/job.go')
          text = job.read_text()
          start = text.index('func (r JobRequest) Validate() error {')
          end = text.index('\nfunc CurrentPriceState', start)
          replacement = r'''func (r JobRequest) Validate() error {
          	if r.JobID == (common.Hash{}) || r.RequesterWallet == (common.Address{}) || r.ModelHash == (common.Hash{}) || r.PromptCommitment == (common.Hash{}) {
          		return errors.New("WQPU job identity/model/prompt commitment are required")
          	}
          	if r.ProtocolVersion != uint32(ProtocolVersion) {
          		return errors.New("unsupported WQPU job protocol version")
          	}
          	if r.PricePerMillionUnits == 0 || r.MaxComputeUnits == 0 || r.MaxChargeUnits == 0 || r.ModelBytes == 0 {
          		return errors.New("WQPU job price/compute/charge/model size must be positive")
          	}
          	if len(r.Providers) == 0 || len(r.Providers) > MaxJobProviders {
          		return errors.New("WQPU job provider count is outside protocol bounds")
          	}
          	var totalCompute, totalModel, expectedCharge uint64
          	seen := map[common.Hash]struct{}{}
          	for _, provider := range r.Providers {
          		if provider.ProviderWallet == (common.Address{}) || provider.ProviderPeerID == (common.Hash{}) {
          			return errors.New("WQPU job provider identity is required")
          		}
          		if provider.ReservedComputeUnits == 0 || provider.AssignedModelBytes == 0 {
          			return errors.New("WQPU job provider reservation must be positive")
          		}
          		if _, exists := seen[provider.ProviderPeerID]; exists {
          			return errors.New("duplicate WQPU provider in job")
          		}
          		seen[provider.ProviderPeerID] = struct{}{}
          		if provider.ReservedComputeUnits > ^uint64(0)-totalCompute || provider.AssignedModelBytes > ^uint64(0)-totalModel {
          			return errors.New("WQPU job reservation overflow")
          		}
          		totalCompute += provider.ReservedComputeUnits
          		totalModel += provider.AssignedModelBytes
          		providerCharge, err := ChargeForUnits(r.PricePerMillionUnits, provider.ReservedComputeUnits)
          		if err != nil {
          			return err
          		}
          		if providerCharge > ^uint64(0)-expectedCharge {
          			return errors.New("WQPU job charge overflow")
          		}
          		expectedCharge += providerCharge
          	}
          	if totalCompute != r.MaxComputeUnits {
          		return errors.New("WQPU provider compute reservations must equal job maximum")
          	}
          	if totalModel != r.ModelBytes {
          		return errors.New("WQPU model bytes must be fully assigned across providers")
          	}
          	if r.MaxChargeUnits != expectedCharge {
          		return errors.New("WQPU job max charge must equal the sum of per-provider charges at the global price")
          	}
          	return nil
          }
          '''
          job.write_text(text[:start] + replacement + text[end:])

          test = Path('chain/x/wqpu/precompile/job_test.go')
          text = test.read_text()
          old = '''\tvar compute uint64
          \tfor _, provider := range providers { compute += provider.ReservedComputeUnits }
          \tcharge, err := ChargeForUnits(price, compute)
          \tif err != nil { t.Fatal(err) }
          '''
          new = '''\tvar compute, charge uint64
          \tfor _, provider := range providers {
          \t\tcompute += provider.ReservedComputeUnits
          \t\tpart, err := ChargeForUnits(price, provider.ReservedComputeUnits)
          \t\tif err != nil { t.Fatal(err) }
          \t\tcharge += part
          \t}
          '''
          if old not in text:
              raise SystemExit('jobRequestFor rounding anchor not found')
          test.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/one-time-fix-job-rounding.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chain/x/wqpu/precompile/job.go chain/x/wqpu/precompile/job_test.go
          git commit -m 'Reserve exact per-provider job charge bound'
          git push origin HEAD:next-foundation
