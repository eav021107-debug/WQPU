name: next-foundation

on:
  push:
    branches: [next-foundation]
  pull_request:
    paths:
      - 'wqpu_next/**'
      - 'client/**'
      - 'chain/**'
      - 'tests/**'
      - 'ARCHITECTURE_V1.md'
      - 'CHAIN_DESIGN.md'
      - 'SECURITY.md'
      - '.github/workflows/next-foundation.yml'

permissions:
  contents: read

jobs:
  python-reference:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q wqpu_next chain tests
      - name: Shell syntax
        run: bash -n chain/devnet.sh
      - name: Unit tests
        run: python -m unittest discover -v -s tests -p 'test_*.py'

  go-consensus-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: chain/go.mod
      - name: Go consensus tests
        working-directory: chain
        run: go test ./...

  go-client-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: client/go.mod
      - name: Go client tests
        working-directory: client
        run: go test ./...
