name: next-foundation

on:
  push:
    branches: [next-foundation]
  pull_request:
    paths:
      - 'wqpu_next/**'
      - 'tests/test_next_foundation.py'
      - 'ARCHITECTURE_V1.md'
      - 'SECURITY.md'
      - '.github/workflows/next-foundation.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q wqpu_next tests
      - name: Unit tests
        run: python -m unittest -v tests.test_next_foundation
