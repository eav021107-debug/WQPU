name: one-time-fix-foundation-tests

on:
  push:
    branches: [next-foundation]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: next-foundation
      - name: Repair test-only fixtures and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          provider = Path('chain/x/wqpu/precompile/provider_publish_test.go')
          text = provider.read_text()
          if '"github.com/ethereum/go-ethereum/common"' not in text:
              text = text.replace(
                  '\t"github.com/ethereum/go-ethereum/crypto"\n',
                  '\t"github.com/ethereum/go-ethereum/common"\n\t"github.com/ethereum/go-ethereum/crypto"\n',
                  1,
              )
              provider.write_text(text)

          accounting = Path('chain/x/wqpu/precompile/session_accounting_test.go')
          text = accounting.read_text()
          pattern = re.compile(
              r'func TestSessionCannotOverbookConcurrentJobs\(t \*testing\.T\) \{.*?\n\}\n',
              re.S,
          )
          replacement = '''func TestSessionCannotOverbookConcurrentJobs(t *testing.T) {
          \tstate, delegation := providerAuthorizedFixture(t)
          \tfor i := 0; i < 10; i++ {
          \t\tif err := ReserveSessionSpend(state, delegation.Wallet, delegation.Session, 121, 100_000); err != nil {
          \t\t\tt.Fatalf("reservation %d failed: %v", i, err)
          \t\t}
          \t}
          \tif err := ReserveSessionSpend(state, delegation.Wallet, delegation.Session, 121, 1); err == nil {
          \t\tt.Fatal("reservation above total session spend limit should fail")
          \t}
          }
          '''
          new_text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('accounting test anchor not found')
          accounting.write_text(new_text)
          PY
          git rm .github/workflows/one-time-fix-foundation-tests.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chain/x/wqpu/precompile/provider_publish_test.go chain/x/wqpu/precompile/session_accounting_test.go
          if git diff --cached --quiet; then
            echo 'Nothing to fix.'
            exit 0
          fi
          git commit -m 'Fix WQPU foundation test fixtures'
          git push origin HEAD:next-foundation
