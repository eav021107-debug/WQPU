name: WQPU dual meter

on:
  push:
  pull_request:

jobs:
  dual-meter:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile dual-meter modules
        run: >-
          python -m py_compile
          wqpu.py wqpu_chain.py wqpu_meter.py wqpu_accounting.py
          wqpu_attestation.py wqpu_runtime.py wqpu_autopay.py
          wqpu_transport_relay.py scripts/check_dual_meter.py
      - name: Signed requester-worker dual-meter round-trip
        run: python scripts/check_dual_meter.py
