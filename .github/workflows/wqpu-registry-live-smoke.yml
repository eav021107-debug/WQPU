name: wqpu-registry-live-smoke

on:
  push:
    branches: [next-foundation]
    paths:
      - 'chain/devnet.sh'
      - 'chain/devnet_config.py'
      - 'chain/runtime_patch*.py'
      - 'chain/cmd/wqpu-rpc-write-smoke/**'
      - 'chain/cmd/wqpu-registry-smoke/**'
      - 'chain/x/wqpu/precompile/**'
      - 'client/internal/chainclient/**'
      - 'client/internal/chainregistry/**'
      - 'client/cmd/wqpu-chainclient-smoke/**'
      - '.github/workflows/wqpu-registry-live-smoke.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  registry-live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'
      - name: Resolve chain Go module checksums
        working-directory: chain
        run: go mod tidy
      - name: Resolve client Go module checksums
        working-directory: client
        run: go mod tidy
      - name: Boot WQPU and verify production client registry
        shell: bash
        env:
          WQPU_CHAIN_SRC: ${{ runner.temp }}/cosmos-evm
          WQPU_CHAIN_BIN_DIR: ${{ runner.temp }}/wqpu-bin
          WQPU_CHAIN_HOME: ${{ runner.temp }}/wqpu-home
        run: |
          set -euo pipefail
          RPC='http://127.0.0.1:8545'
          WQPU_DEVNET_TEST_ADDRESS="$(cd chain && go run ./cmd/wqpu-rpc-write-smoke address)"
          export WQPU_DEVNET_TEST_ADDRESS
          LOG="${RUNNER_TEMP}/wqpu-registry-devnet.log"
          bash chain/devnet.sh --reset >"$LOG" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true' EXIT

          ready=0
          for _ in $(seq 1 180); do
            if ! kill -0 "$PID" 2>/dev/null; then
              cat "$LOG"
              exit 1
            fi
            RESPONSE="$(curl -fsS -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' "$RPC" 2>/dev/null || true)"
            if python3 - "$RESPONSE" <<'PY'
          import json, sys
          try:
              value = int(json.loads(sys.argv[1]).get("result", "0x0"), 16)
          except Exception:
              raise SystemExit(1)
          raise SystemExit(0 if value >= 1 else 1)
          PY
            then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat "$LOG"
            exit 1
          fi

          # Before any provider state exists, the production client must still
          # prove it is connected to the exact WQPU chain and active 0x0900.
          (cd client && go run ./cmd/wqpu-chainclient-smoke "$RPC" identity)

          # Publish the deterministic CI-only provider through the production
          # native write path, then compare both chain-side and client-side reads.
          (cd chain && go run ./cmd/wqpu-rpc-write-smoke run "$RPC")
          (cd chain && go run ./cmd/wqpu-registry-smoke run "$RPC")
          (cd client && go run ./cmd/wqpu-chainclient-smoke "$RPC" published)

          echo 'Live WQPU chain identity + production chainclient registry passed.'
