syntax = "proto3";

package wqpu.v1;

option go_package = "github.com/eav021107-debug/WQPU/chain/x/wqpu/types";

import "wqpu/v1/types.proto";

service Msg {
  rpc AuthorizeSession(MsgAuthorizeSession) returns (MsgAuthorizeSessionResponse);
  rpc RevokeSession(MsgRevokeSession) returns (MsgRevokeSessionResponse);
  rpc PublishProvider(MsgPublishProvider) returns (MsgPublishProviderResponse);
  rpc ReserveJob(MsgReserveJob) returns (MsgReserveJobResponse);
  rpc SubmitReceipt(MsgSubmitReceipt) returns (MsgSubmitReceiptResponse);
  rpc CloseJob(MsgCloseJob) returns (MsgCloseJobResponse);
}

message MsgAuthorizeSession {
  SessionDelegation delegation = 1;
  bytes wallet_signature = 2;
}
message MsgAuthorizeSessionResponse {}

message MsgRevokeSession {
  string wallet = 1;
  string session_address = 2;
  uint64 revocation_nonce = 3;
  bytes wallet_signature = 4;
}
message MsgRevokeSessionResponse {}

message MsgPublishProvider {
  ProviderRecord provider = 1;
  string session_address = 2;
  bytes session_signature = 3;
}
message MsgPublishProviderResponse {}

message MsgReserveJob {
  JobReservation reservation = 1;
  string session_address = 2;
  bytes session_signature = 3;
}
message MsgReserveJobResponse {}

message MsgSubmitReceipt {
  WorkReceipt receipt = 1;
  string requester_session_address = 2;
  bytes requester_signature = 3;
  bytes provider_signature = 4;
}
message MsgSubmitReceiptResponse {}

message MsgCloseJob {
  bytes job_id = 1;
  string session_address = 2;
  bytes session_signature = 3;
}
message MsgCloseJobResponse {}
